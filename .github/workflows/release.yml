name: Patched release

# A person pushes a tag `patched-…` on a commit of main. This workflow runs the import fixes
# and every community patch on BAFU's full release, strictly, and publishes one file as a
# GitHub Release: manifest.json. A run on request builds the manifest and publishes nothing.
#
# No inventory leaves the runner. The manifest holds checksums, counts, who wrote and who
# authorised each patch, and the numbers of the datasets each patch changed; with it, anyone
# who builds the patched release locally can prove they have the same files.
#
# Needs the patch tool (`bafu-fixes`), scripts/check_patched_release.py and
# scripts/full_release_table.py, which are in this repository once the patch tool is merged.

on:
  push:
    tags: ["patched-*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: patched-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the patched release and its manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history: a release is built from a commit of main, and this is checked.
          fetch-depth: 0
          persist-credentials: false
      - name: Build releases from main only
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Install the patch tool
        run: uv sync --locked
      - name: Identify BAFU's release
        id: release
        # The tool knows the release, its checksum and where it keeps the download.
        run: |
          uv run --no-sync python - >> "$GITHUB_OUTPUT" <<'PYTHON'
          from bafu_community_fixes.download import CHECKSUMS, LATEST_RELEASE, cache_dir

          print(f"sha256={CHECKSUMS[LATEST_RELEASE]}")
          print(f"cache={cache_dir()}")
          PYTHON
      - name: Reuse the downloaded release
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.release.outputs.cache }}
          key: bafu-release-${{ steps.release.outputs.sha256 }}
      - name: Run the import fixes and patches, strictly
        # `latest` downloads the release if it isn't there, and checks its SHA-256. `--strict`
        # checks against the EcoSpold 1 schema after the import and after every patch.
        run: |
          mkdir -p "$RUNNER_TEMP/run" "$RUNNER_TEMP/release"
          uv run --no-sync bafu-fixes run latest "$RUNNER_TEMP/patched" --strict \
            --summary "$RUNNER_TEMP/run/summary.json"
      - name: Check the files that were written
        run: |
          uv run --no-sync python scripts/check_patched_release.py "$RUNNER_TEMP/patched" \
            --summary "$RUNNER_TEMP/run/summary.json"
      - name: Say what the run did
        run: |
          uv run --no-sync python scripts/full_release_table.py "$RUNNER_TEMP/run/summary.json" \
            --head-revision "$GITHUB_SHA" --out "$GITHUB_STEP_SUMMARY" --check
      - name: Check the records the patches name
        run: uv run --no-sync python scripts/community.py check
      - name: Write the manifest
        # Refuses a patch that changed data without an authoriser, a patch that names a finding
        # without a record, and files that are not the ones the run summary describes.
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -- --summary "$RUNNER_TEMP/run/summary.json" --output "$RUNNER_TEMP/patched" \
            --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/release/manifest.json"
          if [ -n "$RELEASE_TAG" ]; then set -- "$@" --tag "$RELEASE_TAG"; fi
          uv run --no-sync python scripts/release_manifest.py "$@"
      - name: Keep the manifest (checksums, counts and dataset numbers; no inventory)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: patched-release-manifest
          # This folder only ever holds the manifest written above.
          path: ${{ runner.temp }}/release/manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the manifest
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub Release of the tag, which holds manifest.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: patched-release-manifest
          path: ${{ runner.temp }}/release
      - name: Check that the file is a manifest and nothing else
        run: |
          python3 -I scripts/release_manifest.py --verify "$RUNNER_TEMP/release/manifest.json" \
            --notes "$RUNNER_TEMP/release/notes.md"
      - name: Publish the release with the manifest only
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag is released once: this fails when the release exists already.
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/manifest.json" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release/notes.md" --verify-tag
