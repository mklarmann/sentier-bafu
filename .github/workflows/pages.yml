name: Site

# Builds the site from the records and the issues and deploys it to GitHub Pages: after a push
# to main, once a day (so that "waiting since" and the discussion counts stay current), when an
# issue is opened, closed or reopened, and on request. Pull requests are checked by checks.yml.
#
# Labels do not start a build: scripts/sync.py writes them from the records, and a change of a
# record arrives as a push.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deployment at a time; a run that has started is never cancelled half way.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build the site from the records and the issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The build refuses invalid records. A deploy needs the issues: when they cannot be
        # read the build fails, and the last published site stays.
        run: uv run --no-project --with markdown==3.7 python scripts/build_site.py --require-issues
      - name: Check links, assets and published file types
        run: uv run --no-project python scripts/check_site.py _site
      - name: Hand the site, and nothing else, to the deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
