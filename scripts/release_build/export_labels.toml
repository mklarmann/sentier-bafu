# Labels the export step gives to units and compartments, and the technosphere inputs whose
# declared unit is not the supplying dataset's unit.
#
# A row changes a LABEL only. No amount is multiplied, divided or dropped because of this
# file: `per_reference` is written here so that two labels can be compared (is `kWh` the
# same amount as `MJ`? no), never to convert. The export step (scripts/export_release.py)
# and the audit (scripts/release_build/audit_brightway.py) both read this file, and a test
# exports one dataset per unit and reads the label back from every format.
#
# Columns of [[unit]]:
#   bafu           what BAFU's EcoSpold 1 files write (BAFU:2026 v1 uses these 20 strings on
#                  11,947 reference functions and 420,063 exchanges)
#   brightway      what the Brightway build writes on nodes and exchanges
#                  (sentier-brightway, src/sentier_brightway/units.py at the pinned commit)
#   openlca        the unit name given to the openLCA JSON-LD and ILCD writer. That writer
#                  accepts the unit names of its own table (bw-ilcd-bridge, bw_ilcd/units.py,
#                  which follows openLCA's reference data, GreenDelta/data refdata/units.csv)
#                  and refuses every other string
#   simapro        the unit symbol written to the SimaPro CSV. SimaPro reads a unit only if
#                  the file's own Units block declares it; the writer declares every symbol
#                  it writes
#   quantity, per_reference
#                  the quantity the label measures and how many reference units one unit is,
#                  as openLCA's reference data states them. For comparing labels only
#   source         why the label differs from the Brightway spelling, where it does

[[unit]]
bafu = ["kg"]
brightway = "kilogram"
openlca = "kilogram"
simapro = "kg"
quantity = "Mass"
per_reference = 1.0

[[unit]]
bafu = ["kWh"]
brightway = "kilowatt hour"
openlca = "kilowatt hour"
simapro = "kWh"
quantity = "Energy"
per_reference = 3.6

[[unit]]
bafu = ["MJ"]
brightway = "megajoule"
openlca = "megajoule"
simapro = "MJ"
quantity = "Energy"
per_reference = 1.0

[[unit]]
bafu = ["kBq"]
brightway = "kilo Becquerel"
openlca = "kilo Becquerel"
simapro = "kBq"
quantity = "Radioactivity"
per_reference = 1.0

[[unit]]
bafu = ["Bq"]
brightway = "Becquerel"
openlca = "Becquerel"
simapro = "Bq"
quantity = "Radioactivity"
per_reference = 0.001

[[unit]]
bafu = ["m3"]
brightway = "cubic meter"
openlca = "cubic meter"
simapro = "m3"
quantity = "Volume"
per_reference = 1.0

[[unit]]
bafu = ["Nm3"]
brightway = "normal cubic meter"
openlca = "cubic meter"
simapro = "Nm3"
quantity = "Volume"
per_reference = 1.0
source = """\
The JSON-LD and ILCD writer has no unit named `normal cubic meter` or `Nm3` and refuses \
both. openLCA's reference data lists `Nm3` as a synonym of its unit `m3` (GreenDelta/data, \
refdata/units.csv, read on 13 November 2026), so the openLCA and ILCD files write `cubic \
meter` and each such dataset's description names BAFU's unit. The SimaPro CSV keeps BAFU's \
own symbol `Nm3`, declared in the file as a volume unit equal to 1 m3. The amounts are \
BAFU's: 1 Nm3 is written as 1."""

[[unit]]
bafu = ["tkm"]
brightway = "ton kilometer"
openlca = "ton kilometer"
simapro = "tkm"
quantity = "Goods transport"
per_reference = 1.0

[[unit]]
bafu = ["personkm"]
brightway = "person kilometer"
openlca = "person kilometer"
simapro = "personkm"
quantity = "Person transport"
per_reference = 1.0
source = """\
The SimaPro CSV writer does not know the spelling `person kilometer` and would declare it \
as a unit of its own; it is given BAFU's symbol `personkm`, which it declares as a \
transport unit."""

[[unit]]
bafu = ["p", "unit"]
brightway = "unit"
openlca = "unit"
simapro = "p"
quantity = "Number of items"
per_reference = 1.0
source = """\
BAFU's files write `p` on 12,261 rows and `unit` on 643 for the same thing, a number of \
items; the Brightway build writes `unit` for both."""

[[unit]]
bafu = ["m2"]
brightway = "square meter"
openlca = "square meter"
simapro = "m2"
quantity = "Area"
per_reference = 1.0

[[unit]]
bafu = ["ha"]
brightway = "hectare"
openlca = "hectare"
simapro = "ha"
quantity = "Area"
per_reference = 10000.0

[[unit]]
bafu = ["m2a"]
brightway = "square meter-year"
openlca = "square meter-year"
simapro = "m2a"
quantity = "Area*time"
per_reference = 1.0

[[unit]]
bafu = ["m"]
brightway = "meter"
openlca = "meter"
simapro = "m"
quantity = "Length"
per_reference = 1.0

[[unit]]
bafu = ["km"]
brightway = "kilometer"
openlca = "kilometer"
simapro = "km"
quantity = "Length"
per_reference = 1000.0

[[unit]]
bafu = ["my"]
brightway = "meter-year"
openlca = "meter-year"
simapro = "my"
quantity = "Length*time"
per_reference = 1.0

[[unit]]
bafu = ["kmy"]
brightway = "kilometer-year"
openlca = "kilometer-year"
simapro = "kmy"
quantity = "Length*time"
per_reference = 1000.0

[[unit]]
bafu = ["m3y"]
brightway = "cubic meter-year"
openlca = "cubic meter-year"
simapro = "m3y"
quantity = "Volume*time"
per_reference = 1.0

[[unit]]
