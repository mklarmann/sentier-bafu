brightway = "hour"
openlca = "hour"
simapro = "hr"
quantity = "Duration"
per_reference = 1.0

# Compartments. The SimaPro CSV has one section per compartment, and a flow's row goes into
# the section its compartment belongs to. The CSV writer knows the section of Brightway's
# usual compartment names (`air`, `water`, `soil`, `natural resource`) and writes a flow
# with any other first-level name into "Emissions to air". The Brightway build has three
# kinds of compartment names, so each first part is declared here with its section:
#   categories   the first levels of a flow's `categories` in the Brightway database
#   simapro      the section of the SimaPro CSV
# The subcompartment written is the rest of the flow's categories, as it is in the database.
# A flow in use whose compartment is not listed stops the export.

# EF 3.1 flow list (sentier-vocab), as sentier-brightway writes it
[[compartment]]
categories = ["Emissions", "Emissions to air"]
simapro = "Emissions to air"

[[compartment]]
categories = ["Emissions", "Emissions to water"]
simapro = "Emissions to water"

[[compartment]]
categories = ["Emissions", "Emissions to soil"]
simapro = "Emissions to soil"

[[compartment]]
categories = ["Resources", "Resources from air"]
simapro = "Resources"

[[compartment]]
categories = ["Resources", "Resources from ground"]
simapro = "Resources"

[[compartment]]
categories = ["Resources", "Resources from water"]
simapro = "Resources"

[[compartment]]
categories = ["Land use", "Land occupation"]
simapro = "Resources"

[[compartment]]
categories = ["Land use", "Land transformation"]
simapro = "Resources"

# EF 3.1 flows that the build holds with one level only
[[compartment]]
categories = ["air"]
simapro = "Emissions to air"

[[compartment]]
categories = ["water"]
simapro = "Emissions to water"

[[compartment]]
categories = ["soil"]
simapro = "Emissions to soil"

[[compartment]]
categories = ["natural resource"]
simapro = "Resources"

[[compartment]]
categories = ["land use"]
simapro = "Resources"

# BAFU's own compartments, on flows that have no EF 3.1 flow (the `-residual` database)
[[compartment]]
categories = ["emissions to air"]
simapro = "Emissions to air"

[[compartment]]
categories = ["emissions to water"]
simapro = "Emissions to water"

[[compartment]]
categories = ["emissions to soil"]
simapro = "Emissions to soil"

[[compartment]]
categories = ["resources"]
simapro = "Resources"

[[compartment]]
categories = ["non material emissions"]
simapro = "Non material emissions"

[[compartment]]
categories = ["economic issues"]
simapro = "Economic issues"

# Technosphere inputs whose declared unit is another quantity or magnitude than the unit of
# the dataset that supplies them. The Brightway build links an input to its supplier by the
# supplier's number and uses the amount as written, whatever the two unit labels say. The
# audit lists every such input and the export writes it as built, with the declared unit
# beside it. Each one belongs to a finding; one without a row here is a finding of the audit.
#   supplier        the supplying dataset: its number in BAFU's release and its code (the
#                   part of its file name after `process_`)
#   declared        the unit the input declares, in the Brightway spelling
#   supplier_unit   the supplier's reference unit, in the Brightway spelling
#   finding         the finding it belongs to

[[declared_unit_difference]]
finding = "F13"
supplier_number = 401085
supplier = "c1f04203-96ec-320c-85f5-e56aaa86729b"
declared = "kilowatt hour"
supplier_unit = "megajoule"
note = """\
`Electricity, natural gas, at power plant` (FI) has the reference unit MJ; its one consumer \
takes it in kWh. Finding F13: the dataset is modelled per kWh, so the label MJ is the \
error and the amount needs no conversion."""
