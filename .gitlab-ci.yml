# Portable GitLab Pages deployment if this project is mirrored to GitLab.
# GitHub remains the canonical source repository.
image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

# The repository root also holds the bafu-community-fixes package (Python >= 3.14,
# `.python-version`). These jobs check the records and the site only: keep them on the
# image's Python 3.12 and outside the package project, as the GitHub workflows do. The
# package itself is tested by the fourth job of .github/workflows/checks.yml.
variables:
  UV_PYTHON: "3.12"

stages: [test, deploy]

validate-community:
  stage: test
  script:
    - python3 scripts/community.py check
    - python3 -m unittest discover -s community/tests
    - python3 scripts/build_checks.py community/templates/build-audit.json
    - uv run --no-project --with pandas==2.2.3 --with pyarrow==19.0.1 python3 -m unittest discover -s registry-tests

publish-pages:
  stage: deploy
  script:
    - uv run --no-project --with markdown==3.7 scripts/build_site.py --out public
    - python3 scripts/check_site.py public
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
